[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwnm-sync"
version = "0.2.0"
description = "Sync patch state between Patchwork and Notmuch"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click",
    "notmuch2",
    "peewee",
    "platformdirs",
    "requests",
]

[project.optional-dependencies]
dev = ["ruff~=0.16.0"]

[project.scripts]
pwnm-sync = "pwnm_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pwnm_sync"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
